[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E712"]

[tool.coverage.run]
source = ["evalanche"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
