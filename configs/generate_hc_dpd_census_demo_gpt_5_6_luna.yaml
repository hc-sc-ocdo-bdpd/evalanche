run:
  name: hc_dpd_census_demo_gpt_5_6_luna
  input_path: data/hc/benchmarks/dpd_structured_extraction_census/0.2.0/demo_cases.csv
  output_path: data/generated/hc_dpd_census_demo_gpt_5_6_luna_outputs.csv

candidate_models_path: configs/candidate_gpt_5_6_luna.yaml
endpoint_pricing_path: configs/endpoint_pricing_azure_global_gpt_5_6_luna.yaml

prompt:
  system: >-
    You are a careful structured-data extraction system. Follow the
    requested JSON schema exactly, preserve source-language values, and
    return only one valid JSON object with no Markdown or explanation.
  template: "{input}"

generation:
  continue_on_error: true
  max_completion_tokens: 900
  max_workers: 4
  max_requests_per_minute: ${DPD_DEMO_RPM:-60}
  checkpoint_every: 24
  resume: false
