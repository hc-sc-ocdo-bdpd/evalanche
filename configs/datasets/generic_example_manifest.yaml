schema_version: "1.0"

release:
  dataset_id: generic_instruction_following_example
  version: "1.0.0"
  release_type: benchmark
  title: Generic instruction-following example cases
  description: >-
    Six synthetic cases used to demonstrate Evalanche generation, routing,
    deterministic evaluation, and LLM judge evaluation.
  created_at_utc: "2026-07-21T00:00:00Z"
  status: frozen
  immutable: true
  license_or_terms: Repository terms; synthetic test data only.
  intended_use: Local development, examples, and regression checks.
  limitations:
    - The cases are synthetic and are not representative of a production task.
    - Six cases are too few for a stable model comparison.
  languages:
    - en
  task_types:
    - instruction_following

sources:
  - source_id: evalanche_synthetic_examples
    name: Evalanche synthetic examples
    source_url: https://github.com/hc-sc-ocdo-bdpd/evalanche
    retrieved_at_utc: "2026-07-21T00:00:00Z"
    source_modified_date: "2026-07-21"
    license_or_terms: Repository terms; synthetic test data only.
    snapshot_notes: The file is maintained in the Evalanche repository.

files:
  - file_id: generic_cases
    source_id: evalanche_synthetic_examples
    role: benchmark_cases
    relative_path: data/examples/generic_cases.csv
    media_type: text/csv
    language: en
    byte_size: 1102
    sha256: 4420e30063e3be89cd82f6ef4147d099038f54db0f2d718fde5c88cfeedf662a
    record_count: 6
    record_count_method: csv_rows
    parser_schema_version: generic_cases/1.0
    validation_status: passed
    validation_error_count: 0

sampling:
  method: full_population
  unit: case
  population_description: All synthetic cases in generic_cases.csv.
  target_count: 6
  membership_file_id: generic_cases
  member_id_column: case_id
  seed:
  inclusion_criteria:
    - Case has an instruction, expected output, and supported evaluation type.
  exclusion_criteria:
    - Case contains sensitive, protected, or confidential information.
  strata: []

splits:
  - name: development
    purpose: Example development and smoke testing.
    unit: case
    target_count: 5
    group_key: case_id
    selection_policy: Cases 001 through 005 are the development examples.
    member_ids:
      - case_001
      - case_002
      - case_003
      - case_004
      - case_005
  - name: heldout
    purpose: Demonstrate an explicitly recorded held-out assignment.
    unit: case
    target_count: 1
    group_key: case_id
    selection_policy: Case 006 is reserved as the held-out example.
    member_ids:
      - case_006

lineage:
  parent_dataset_version:
  code_version: repository snapshot for dataset manifest schema 1.0
  transformations:
    - Cases were authored as synthetic examples.
    - CSV quoting preserves expected JSON values.