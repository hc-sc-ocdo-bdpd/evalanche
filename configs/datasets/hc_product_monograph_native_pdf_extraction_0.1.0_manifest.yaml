schema_version: '1.0'
release:
  dataset_id: hc_product_monograph_native_pdf_extraction
  version: 0.1.0
  release_type: benchmark
  title: Health Canada Product Monograph native-PDF pilot
  description: A retired local-only bilingual pilot that sends each complete official
    Product Monograph PDF to the model through a native file-input API.
  created_at_utc: '2026-08-04T13:30:00Z'
  status: retired
  immutable: true
  license_or_terms: Official Product Monographs are publicly posted by Health Canada.
    Copyright in individual monographs may remain with their sponsors. The repository
    stores source locks and descriptors, not source PDF bytes.
  intended_use: Reproduce local experiments in end-to-end full-document retrieval,
    visual reading, and structured extraction. The pilot must not be used for official
    model ranking.
  limitations:
  - This retired release is permanently provisional and must not produce an official
    model ranking.
  - Reference labels originate in the frozen DPD alignment and have automated page-evidence
    checks, not independent human sign-off.
  - The historical label-review snapshot is retained only to reproduce the original
    pilot; no review campaign is planned.
  - Native PDF processing and tokenization can differ between providers, so results
    are comparable only within a declared input contract.
  - DIN, regulatory schedule, product status, and sponsor are alignment metadata and
    are not scored.
  - The 40-product purposive sample is not representative of every marketed drug or
    document format.
  languages:
  - en
  - fr
  task_types:
  - bilingual_structured_extraction
  - native_pdf_document_understanding
  - product_monograph_extraction
