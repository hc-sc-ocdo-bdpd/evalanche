sampling:
  method: full_population
  unit: product_family
  population_description: Every marketed human-drug product family in the frozen 2026-07-02
    DPD archive that can produce paired English and French cases under the version 1.0 JSON
    contract.
  target_count: 7017
  membership_file_id: dpd_census_products
  member_id_column: product_id
  seed: null
  inclusion_criteria:
  - DPD class is Human.
  - Exactly one current status row is MARKETED.
  - DIN is an eight-digit numeric identifier.
  - Exactly one DIN_OWNER and complete English and French ingredient, form, route, schedule,
    and status labels are available.
  - Strength values are numeric and the product family can produce paired English and French
    JSON cases.
  - Single-ingredient, multi-ingredient, multi-variant, and multi-ingredient multi-variant
    families are all included.
  exclusion_criteria:
  - Veterinary, disinfectant, and radiopharmaceutical DPD classes.
  - Cancelled, dormant, approved-only, missing, or ambiguous current status.
  - Invalid DIN, missing reference fields, ambiguous DIN owner, or nonnumeric strength.
  - Product families with conflicting French brand names across variants, pending manual adjudication.
  strata:
  - single_ingredient
  - multi_ingredient
  - multi_variant
  - multi_ingredient_multi_variant
splits:
- name: census
  purpose: Full eligible-population coverage and stress evaluation. This is not a prompt-development
    or hidden-test split.
  unit: product_family
  target_count: 7017
  group_key: product_id
  selection_policy: All eligible product-family IDs are included; no sampling or split assignment
    is applied.
