schema_version: '1.0'
release:
  dataset_id: hc_dpd_structured_extraction_census
  version: 0.2.0
  release_type: benchmark
  title: Health Canada DPD bilingual structured extraction census
  description: A reproducible full-population benchmark containing every marketed human-drug
    product family that satisfies the version 1.0 bilingual JSON case contract.
  created_at_utc: '2026-07-27T00:00:00Z'
  status: frozen
  immutable: true
  license_or_terms: Open Government Licence - Canada; attribute Health Canada, Drug Product
    Database; https://open.canada.ca/en/open-government-licence-canada
  intended_use: Measure DPD structured-extraction coverage, model reliability, operational
    performance, and subgroup behavior across the complete eligible frozen population. Use
    the bounded demo view for live demonstrations.
  limitations:
  - Inputs render DPD relational records and are not Product Monograph documents.
  - Thirteen source-ambiguous French-brand families require manual adjudication and are excluded.
  - Reference labels have not yet been manually audited against Product Monographs.
  - This release alone cannot support a general Health Canada model recommendation.
  languages:
  - en
  - fr
  task_types:
  - bilingual_structured_extraction
  - dpd_reference_normalization
  - full_population_stress_evaluation
