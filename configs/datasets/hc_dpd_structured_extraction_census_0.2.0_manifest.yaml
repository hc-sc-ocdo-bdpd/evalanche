  - Verified the frozen parent manifest and every parent file hash before reading source rows.
  - Validated the marketed ZIP member schema and parsed relational tables with explicit columns
    and no headers.
  - Joined DPD tables by DRUG_CODE and retained complete marketed human-drug records.
  - Grouped product families by DIN owner, normalized English brand, and active-ingredient
    code set.
  - Included every representable family across all four complexity strata without population
    sampling.
  - Generated paired English and French JSON cases with exact archive-member row traceability.
  - Compressed full-population CSV artifacts with deterministic gzip metadata and generated
    a fixed 24-case live-demo view.