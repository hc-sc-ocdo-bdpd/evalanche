    Database; https://open.canada.ca/en/open-government-licence-canada
  intended_use: Validate Health Canada benchmark acquisition, normalization, deterministic
    sampling, source traceability, bilingual case generation, and Evalanche execution plumbing
    before Product Monographs are added.
  limitations:
  - Inputs render DPD relational records and are not Product Monograph documents.
  - Reference labels have not yet been manually audited against Product Monographs.
  - The 40-product slice is too small and too narrow for a general Health Canada model recommendation.
  - Product Monograph availability and document-quality exclusions have not yet been applied.
