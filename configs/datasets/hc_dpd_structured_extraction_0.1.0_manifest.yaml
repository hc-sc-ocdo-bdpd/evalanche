sampling:
  method: stratified_random
  unit: product_family
  population_description: Eligible marketed human-drug product families in the frozen 2026-07-02
    DPD marketed archive, grouped by DIN owner, normalized brand, and active-ingredient codes.
  target_count: 40
  membership_file_id: dpd_benchmark_products
  member_id_column: product_id
  seed: 20260702
  inclusion_criteria:
  - DPD class is Human.
  - Exactly one current status row is MARKETED.
  - DIN is an eight-digit numeric identifier.
  - Exactly one DIN_OWNER and complete English and French ingredient, form, route, schedule,
    and status labels are available.
  - Strength values are numeric and every selected product can produce paired English and
    French cases.
  - The release collectively covers oral, injectable, topical, inhaled, and ophthalmic routes.
  exclusion_criteria:
  - Veterinary, disinfectant, and radiopharmaceutical DPD classes.
  - Cancelled, dormant, approved-only, missing, or ambiguous current status.
  - Invalid DIN, missing reference fields, ambiguous DIN owner, or nonnumeric strength.
  - Multi-ingredient families that also contain multiple variants, deferred from this first
    slice.
  - Any candidate whose active-ingredient code overlaps a product already selected for this
    release.
  strata:
  - single_ingredient
  - multi_ingredient
  - multi_variant
