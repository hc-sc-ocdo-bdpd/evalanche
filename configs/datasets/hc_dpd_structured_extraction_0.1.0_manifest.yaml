lineage:
  parent_dataset_version: 2026.7.2
  code_version: evalanche 0.1.0; hc_dpd_benchmark/1.0
  transformations:
  - Verified the frozen parent manifest and all parent file hashes before reading source rows.
  - Validated the marketed ZIP member schema and parsed relational tables with explicit columns
    and no headers.
  - Joined DPD tables by DRUG_CODE and retained complete marketed human-drug records.
  - Grouped product families by DIN owner, normalized brand, and active-ingredient code set.
  - Applied seeded deterministic stratified selection with required route coverage and active-ingredient
    isolation across splits.
  - Generated paired English and French JSON extraction cases and recorded exact archive-member
    row numbers.