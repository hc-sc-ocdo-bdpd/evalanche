  release_type: source_snapshot
  title: Health Canada Drug Product Database source snapshot
  description: Immutable official DPD marketed and approved UTF-8 extracts published 2026-07-02.
  created_at_utc: '2026-07-22T14:36:16Z'
  status: frozen
  immutable: true
  license_or_terms: Open Government Licence - Canada; attribute Health Canada, Drug Product
    Database; https://open.canada.ca/en/open-government-licence-canada
  intended_use: Source data for reproducible Health Canada drug-product normalization, sampling,
    and benchmark construction.
  limitations:
  - The archives contain human, veterinary, disinfectant, and radiopharmaceutical products;
    downstream filtering is required.
  - The snapshot contains marketed and approved cohorts only, not cancelled or dormant products.
  - The source archives do not include product monograph PDF files.
  - The official download URLs are dynamic; reproducibility depends on the frozen local bytes
    and hashes.
  - Record counts sum heterogeneous relational tables and are not counts of unique products.
  languages:
  - en
  - fr
  task_types:
  - structured_reference_data
