schema_version: '1.0'
release:
  dataset_id: hc_product_monograph_native_pdf_extraction
  version: 1.0.0
  release_type: benchmark
  title: Health Canada Product Monograph native-PDF extraction
  description: A draft, human-audit-gated bilingual 200-family, 400-document structured-extraction
    benchmark using complete native PDFs.
  created_at_utc: '2026-08-11T13:46:30Z'
  status: draft
  immutable: false
  license_or_terms: Official Product Monographs are publicly posted by Health Canada.
    Individual sponsor copyright may apply. The repository stores hashes, citations,
    and extracted evidence, not PDFs.
  intended_use: Compare bilingual Product Monograph extraction after all provisional
    labels and document scope are human approved.
  limitations:
  - The release is draft and cannot support ranked claims until every fact and product-scope
    audit is approved.
  - The purposive cohort is larger and more diverse but is not a probability sample
    of every marketed drug.
  - Products must have distinct, text-extractable, automatically alignable English
    and French monographs, which creates selection bias.
  - DIN, schedule, product status, and sponsor are alignment metadata and are not
    scored.
  languages:
  - en
  - fr
  task_types:
  - bilingual_structured_extraction
  - native_pdf_document_understanding
  - product_monograph_extraction
