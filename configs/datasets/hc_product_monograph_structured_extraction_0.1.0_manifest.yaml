schema_version: '1.0'
release:
  dataset_id: hc_product_monograph_structured_extraction
  version: 0.1.0
  release_type: benchmark
  title: Health Canada Product Monograph structured extraction
  description: A bilingual 40-product, 80-document evidence-grounded structured-extraction
    pilot using official Product Monographs.
  created_at_utc: '2026-07-30T23:00:00Z'
  status: frozen
  immutable: true
  license_or_terms: Official Product Monographs are publicly posted by Health Canada.
    Copyright in individual monographs may remain with their sponsors. The benchmark
    stores hashes, citations, and extracted evidence, not source PDFs.
  intended_use: Compare model extraction quality on bounded, auditable English and
    French Product Monograph evidence.
  limitations:
  - The pilot evaluates extraction from evidence-selected pages, not retrieval from
    an entire monograph.
  - DIN, regulatory schedule, product status, and sponsor are alignment metadata and
    are not scored because they are not consistently stated in the monographs.
  - Automated source-evidence checks are complete, but independent human label sign-off
    is not claimed.
  - The 40-product purposive sample is not representative of all marketed drugs or
    all document formats.
  languages:
  - en
  - fr
  task_types:
  - bilingual_structured_extraction
  - product_monograph_extraction
