run:
  name: judge_generated_generic_first_slice
  input_path: data/generated/generic_generated_outputs.csv
  output_path: results/judge_generated_generic_first_slice_results.csv

judge:
  model: ${JUDGE_MODEL:-azure/gpt-5.4-mini}
  variant_id: primary
  temperature: 0
  max_retries: 3
  prompt_id: evalanche.criteria_pointwise
  prompt_version: "1.0"
  rubric_id: generated_generic_instruction_following
  rubric_version: "1.0"
  candidate_identity_blinded: true
  reference_mode: required

task:
  name: generated_generic_instruction_following
  description: >
    Evaluate whether the candidate model output satisfies the user instruction
    and matches the expected output. The input is self-contained. Do not assume
    any external private context.
  measured_construct: >
    Correct, complete, and format-conforming responses to the supplied
    instruction, assessed against the supplied expected output.
  intended_use: >
    Exploratory review of user-confirmed candidate models. Comparative
    selection requires a matching validated judge protocol.
  languages: [en]

scoring:
  score_min: 0
  score_max: 5
  pass_threshold: 0.75

criteria:
  - name: correctness
    weight: 0.70
    description: >
      The output is semantically correct relative to the instruction and expected
      output. Do not heavily penalize formatting issues here unless the formatting
      changes the meaning. Format problems should primarily be scored under
      format_following.

  - name: completeness
    weight: 0.20
    description: >
      The output includes all required information. Do not penalize minor wording
      or formatting differences here if the required information is present.

  - name: format_following
    weight: 0.10
    description: >
      The output follows the requested format, label set, or structure.
