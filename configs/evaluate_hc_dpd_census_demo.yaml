run:
  name: evaluate_hc_dpd_census_demo
  input_path: data/generated/hc_dpd_census_demo_outputs.csv
  output_path: results/evaluate_hc_dpd_census_demo_results.csv

metrics:
  case_sensitive: false
  trim_whitespace: true
  collapse_whitespace: true
  unicode_normalization: NFC
  json_comparison:
    unordered_list_paths:
      - /din
      - /active_ingredients
      - /dosage_forms
      - /routes
      - /schedule
    numeric_value_paths:
      - /active_ingredients/*/strength
    zero_pad_numeric_string_paths:
      /din/*: 8

judge:
  model: ${JUDGE_MODEL:-azure/gpt-5.4-mini}
  temperature: 0
  max_retries: 3
  continue_on_error: true

task:
  name: hc_dpd_bilingual_structured_extraction
  description: >-
    Evaluate whether each candidate returned valid JSON containing the
    requested Health Canada DPD facts. All cases use deterministic JSON
    scoring, so this configuration does not make LLM judge calls.

scoring:
  score_min: 0
  score_max: 5
  pass_threshold: 0.75

selection:
  enabled: true
  minimum_score_margin: 0.02
  weights:
    quality: 0.70
    cost: 0.00
    latency: 0.15
    reliability: 0.15
  constraints:
    require_model_profile: false
    minimum_pass_rate: 0.75
    maximum_p95_latency_seconds: 15
    maximum_generation_failure_rate: 0.05
    required_capabilities: []
  model_profiles: []

criteria:
  - name: correctness
    weight: 0.70
    description: >-
      The output matches the reference facts. This rubric is retained for
      configuration compatibility but is not used for JSON-routed cases.
  - name: completeness
    weight: 0.20
    description: >-
      The output contains every required field. This rubric is not used
      for JSON-routed cases.
  - name: format_following
    weight: 0.10
    description: >-
      The output follows the requested JSON format. This rubric is not
      used for JSON-routed cases.