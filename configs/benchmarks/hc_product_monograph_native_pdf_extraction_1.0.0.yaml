          topique: route topical fr
          rectal: route rectal en
          rectale: route rectal fr
          buccale: route buccal fr
          spinal: route spinal en
          rachidienne: route spinal fr
slice_columns: &id001
- language
- split
- stratum
- route_group
- document_complexity
group_key: product_id
language_column: language
required_capabilities:
- pdf_input
- responses_api
- vision
runtime:
  request_api: responses
  max_completion_tokens: 900
  max_workers: 1
  max_requests_per_minute: 10
  checkpoint_every: 5
  resume: true
tiers:
  smoke:
    description: Two bilingual product pairs for transport and parsing checks.
    sampling:
      method: balanced
      unit: group
      count: 2
      seed: 20260811
      stratify_by: *id001
    cost:
      initial_prompt_tokens: 150000
      initial_completion_tokens: 900
      safety_multiplier: 2.0
      request_ceiling_multiplier: 2.0
  screen:
    description: Twenty-five cumulative bilingual pairs for screening.
    inherits: smoke
    sampling:
      method: balanced
      unit: group
      count: 25
      seed: 20260811
      stratify_by: *id001
    cost:
      sample_from: smoke
      initial_prompt_tokens: 150000
      initial_completion_tokens: 900
      safety_multiplier: 1.75
      request_ceiling_multiplier: 2.0
    promotion:
      minimum_pass_rate: 0.5
      maximum_generation_failure_rate: 0.05
  standard:
    description: The complete 400-case expanded cohort. Earlier tier calls are reused,
      so promoted models make at most 400 calls.
    inherits: screen
    sampling:
      method: all
      unit: group
      seed: 20260811
      stratify_by: *id001
    cost:
      sample_from: screen
      initial_prompt_tokens: 150000
      initial_completion_tokens: 900
      safety_multiplier: 1.5
      request_ceiling_multiplier: 1.75
limitations:
- This expanded release is draft until every fact and product audit item is approved.
- The 200-family purposive sample is not a probability sample of all marketed drugs.
- Bilingual availability, text extraction, and automated fact alignment are selection
  requirements.
- DIN, schedule, product status, and sponsor are not scored.
