          nasale: route nasal fr
          voie intranasale: route nasal fr
          ophthalmic: route ophthalmic en
          ophtalmique: route ophthalmic fr
          pour usage ophtalmique: route ophthalmic fr
          topical: route topical en
          topique: route topical fr
          rectal: route rectal en
          rectale: route rectal fr
          buccale: route buccal fr
          spinal: route spinal en
          rachidienne: route spinal fr
slice_columns:
  - language
  - split
  - stratum
  - document_complexity
group_key: product_id
language_column: language
runtime:
  max_completion_tokens: 900
  max_workers: 4
  max_requests_per_minute: 60
  checkpoint_every: 20
  resume: true
limitations:
  - The evidence-window condition evaluates extraction from evidence-selected pages, not full-document retrieval.
  - DIN, schedule, product status, and sponsor are alignment metadata and are not scored.
  - Independent human label sign-off is not claimed.
  - Results from 40 products do not represent every drug or document format.
