schema_version: "1.0"
benchmark_id: hc_product_monograph_native_pdf_extraction
version: 0.1.0
title: Health Canada Product Monograph native-PDF pilot
description: >-
  Retired local-only bilingual pilot using 80 complete official English and
  French Product Monograph PDFs representing 40 marketed human-drug product
  families. It is retained for reproducibility, not official model ranking.
status: retired
ranking:
  enabled: false
  reason: >-
    Reference labels were not independently human validated. This local-only
    pilot is retained as permanently provisional development evidence.
dataset:
  dataset_id: hc_product_monograph_native_pdf_extraction
  version: 0.1.0
  manifest_path: configs/datasets/hc_product_monograph_native_pdf_extraction_0.1.0_manifest.yaml
  cases_path: data/hc/benchmarks/product_monograph_native_pdf_extraction/0.1.0/cases.csv.gz
prompt:
  version: "1.0"
  system: >-
    You are a careful full-document structured-data extraction system. Use only
    the attached Product Monograph, follow the requested JSON schema exactly,
    preserve source-language values, and return one JSON object with no Markdown
    or explanation.
  template: "{input}"
scoring:
  evaluation_type: json
  version: "1.1"
  required_output_fields:
    - brand_name
    - active_ingredients
    - dosage_forms
    - routes
  metrics:
    case_sensitive: false
    trim_whitespace: true
    collapse_whitespace: true
    unicode_normalization: NFKC
    strip_diacritics: true
    strip_punctuation: true
    json_comparison:
      set_list_paths:
        - /active_ingredients
        - /dosage_forms
        - /routes
      numeric_value_paths:
        - /active_ingredients/*/strength
      strip_parenthetical_paths:
        - /active_ingredients/*/name
      value_aliases:
        /active_ingredients/*/name:
          vardénafil: ingredient vardenafil fr
          vardénafil sous forme de trihydrate de chlorhydrate de vardénafil: ingredient vardenafil fr
