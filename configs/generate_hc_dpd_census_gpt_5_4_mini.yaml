run:
  name: hc_dpd_full_census_gpt_5_4_mini
  input_path: data/hc/benchmarks/dpd_structured_extraction_census/0.2.0/cases.csv.gz
  output_path: data/generated/hc_dpd_census_gpt_5_4_mini_outputs.csv

candidate_models_path: configs/candidate_gpt_5_4_mini.yaml
endpoint_pricing_path: configs/endpoint_pricing_azure_global_gpt_5_4_mini.yaml

prompt:
  system: >-
    You are a careful structured-data extraction system. Follow the
    requested JSON schema exactly, preserve source-language values, and
    return only one valid JSON object with no Markdown or explanation.
  template: "{input}"

generation:
  continue_on_error: true
  max_completion_tokens: 900
  max_workers: 2
  max_requests_per_minute: 30
  checkpoint_every: 100
  resume: true
  cost_preflight_sample_path: ${COST_PREFLIGHT_SAMPLE_PATH:-data/generated/hc_dpd_census_demo_outputs.csv}
  maximum_estimated_cost_usd: 30.00
  cost_safety_multiplier: 1.50
