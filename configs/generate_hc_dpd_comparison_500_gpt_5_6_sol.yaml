run:
  name: hc_dpd_comparison_500_gpt_5_6_sol
  input_path: data/hc/demos/dpd_model_comparison/1.0.0/cases.csv
  output_path: data/generated/hc_dpd_comparison_500_gpt_5_6_sol_outputs.csv

candidate_models_path: configs/candidate_gpt_5_6_sol.yaml
endpoint_pricing_path: configs/endpoint_pricing_azure_global_gpt_5_6_sol.yaml

prompt:
  system: >-
    You are a careful structured-data extraction system. Follow the
    requested JSON schema exactly, preserve source-language values, and
    return only one valid JSON object with no Markdown or explanation.
  template: "{input}"

generation:
  continue_on_error: true
  max_completion_tokens: 900
  max_workers: 4
  max_requests_per_minute: ${DPD_COMPARISON_RPM:-60}
  checkpoint_every: 50
  resume: true
  cost_preflight_sample_path: data/generated/hc_dpd_census_demo_gpt_5_6_sol_outputs.csv
  maximum_estimated_cost_usd: 20.00
  cost_safety_multiplier: 1.50
