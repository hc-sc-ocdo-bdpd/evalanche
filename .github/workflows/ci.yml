name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report

      - name: Verify committed DPD census
        run: |
          python -m evalanche.cli verify-dataset \
            --manifest configs/datasets/hc_dpd_structured_extraction_census_0.2.0_manifest.yaml \
            --root .

      - name: Verify benchmark registry and Product Monograph releases
        run: |
          python -m evalanche.cli registry-validate --root .
          python -m evalanche.cli verify-dataset \
            --manifest configs/datasets/hc_product_monograph_structured_extraction_0.1.0_manifest.yaml \
            --root .
          python -m evalanche.cli verify-dataset \
            --manifest configs/datasets/hc_product_monograph_native_pdf_extraction_0.1.0_manifest.yaml \
            --root .

  docker:
    name: Clean-checkout Docker workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create local environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: |
          docker compose build
          docker compose create evalanche

      - name: Verify offline commands without network access
        run: |
          image_id="$(docker compose images -q evalanche)"
          test -n "$image_id"
          docker run --rm --network none \
            --volume "$PWD:/app" --workdir /app "$image_id" \
            python -m evalanche.cli --help
          docker run --rm --network none \
            --volume "$PWD:/app" --workdir /app "$image_id" \
            python -m evalanche.cli registry-validate --root .
          docker run --rm --network none \
            --volume "$PWD:/app" --workdir /app "$image_id" \
            python -m evalanche.cli evidence-status --root . --check
          docker run --rm --network none \
            --volume "$PWD:/app" --workdir /app "$image_id" \
            python -m evalanche.cli init-task \
              --root . \
              --task-id ci_classification \
              --description "Offline Docker initialization check." \
              --family classification \
              --language en \
              --unacceptable-error "Returning the wrong label." \
              --model ci_model=test/ci-model \
              --sample-input "Example input" \
              --sample-expected-output routine \
              --non-interactive

      - name: Run documented Docker quality gate
        run: |
          docker compose run --rm evalanche sh -lc \
            "python -m pip install --no-cache-dir -r requirements-dev.txt && ruff check . && coverage run -m pytest && coverage report --fail-under=80"
